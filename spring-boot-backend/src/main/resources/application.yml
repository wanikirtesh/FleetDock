server:
  port: 8080
  compression:
    enabled: true
  shutdown: graceful

spring:
  application:
    name: fleetdock-orchestrator
  datasource:
    # Defaults to a local MySQL instance; set SPRING_DATASOURCE_URL to use another database.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fleetdock?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

fleetdock:
  cors:
    allowed-origins: "*"
  security:
    jwt-secret: ${JWT_SECRET:${fleetdock.security.vault-key}}
    vault-key: ${VAULT_MASTER_KEY:fleetdock-aes-256-master-key-xyz}
  docker:
    connection-timeout-seconds: 10
    response-timeout-seconds: 45

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
